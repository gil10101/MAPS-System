<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Appointments — MAPS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="page">
    <div class="container stack">
      <div class="row between">
        <div>
          <h1>My appointments</h1>
          <p class="muted" style="margin:0;">Review, track, and cancel your bookings.</p>
        </div>
        <a href="/app/doctors.html" class="btn">＋ Book appointment</a>
      </div>

      <div class="card">
        <div class="row" style="gap:.5rem; margin-bottom:1rem;">
          <button class="btn secondary sm filter active" data-filter="all">All</button>
          <button class="btn secondary sm filter" data-filter="upcoming">Upcoming</button>
          <button class="btn secondary sm filter" data-filter="past">Past</button>
        </div>
        <div id="list"><div class="loading-wrap"><span class="spinner"></span></div></div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const user = MAPS.requireAuth('patient');
    let appointments = [];
    let filter = 'all';

    if (user) { MAPS.renderNav(); wireFilters(); load(); }

    function wireFilters() {
      document.querySelectorAll('.filter').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          filter = b.dataset.filter;
          render();
        });
      });
    }

    async function load() {
      try {
        const data = await MAPS.api('/appointments');
        appointments = data.appointments;
        render();
      } catch (err) {
        document.getElementById('list').innerHTML =
          `<div class="alert error">${MAPS.escapeHtml(err.message)}</div>`;
      }
    }

    function visible() {
      if (filter === 'upcoming') return appointments.filter(a => a.status === 'pending' || a.status === 'confirmed');
      if (filter === 'past') return appointments.filter(a => a.status === 'completed' || a.status === 'cancelled');
      return appointments;
    }

    function render() {
      const rows = visible();
      const host = document.getElementById('list');
      if (rows.length === 0) {
        host.innerHTML = `<div class="empty"><div class="big">📅</div><p>Nothing here yet.</p>
          <a href="/app/doctors.html" class="btn">Book an appointment</a></div>`;
        return;
      }
      host.innerHTML = `
        <div class="table-wrap"><table>
          <thead><tr><th>Doctor</th><th>Date</th><th>Time</th><th>Reason</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows.map(row).join('')}</tbody>
        </table></div>`;
    }

    function row(a) {
      const canCancel = a.status === 'pending' || a.status === 'confirmed';
      return `
        <tr>
          <td>
            <strong>${MAPS.escapeHtml(a.doctor_name)}</strong>
            <div class="muted small">${MAPS.escapeHtml(a.specialty_name || '')}</div>
          </td>
          <td>${MAPS.formatDate(a.appt_date)}</td>
          <td>${MAPS.formatTime(a.appt_time)}</td>
          <td class="muted">${MAPS.escapeHtml(a.reason || '—')}</td>
          <td>${MAPS.statusBadge(a.status)}</td>
          <td style="text-align:right;">
            ${canCancel ? `<button class="btn danger sm" onclick="cancelAppt(${a.id})">Cancel</button>` : ''}
          </td>
        </tr>`;
    }

    async function cancelAppt(id) {
      if (!confirm('Cancel this appointment? This cannot be undone.')) return;
      try {
        await MAPS.api(`/appointments/${id}/cancel`, { method: 'PATCH' });
        MAPS.toast('Appointment cancelled.', 'success');
        load();
      } catch (err) {
        MAPS.toast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
