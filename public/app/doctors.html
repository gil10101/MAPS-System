<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Doctor — MAPS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="page">
    <div class="container stack">
      <div>
        <h1>Find a doctor</h1>
        <p class="muted" style="margin:0;">Search by name or specialty, then pick an open time.</p>
      </div>

      <div class="card">
        <div class="field-row" style="margin-bottom:0;">
          <div class="field" style="margin-bottom:.5rem;">
            <label for="q">Search by name</label>
            <input class="input" id="q" placeholder="e.g. Chen" />
          </div>
          <div class="field" style="margin-bottom:.5rem;">
            <label for="specialty">Specialty</label>
            <select id="specialty"><option value="">All specialties</option></select>
          </div>
        </div>
      </div>

      <div id="results" class="grid cols-2">
        <div class="loading-wrap"><span class="spinner"></span></div>
      </div>
    </div>
  </main>

  <!-- Booking modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="m-title">Book appointment</h3>
        <button class="close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="m-alert"></div>
        <div class="row" style="gap:.9rem; align-items:center; margin-bottom:1rem;">
          <div class="avatar" id="m-avatar"></div>
          <div>
            <strong id="m-doctor"></strong>
            <div class="muted small" id="m-specialty"></div>
          </div>
        </div>
        <div class="field">
          <label for="m-date">Choose a date</label>
          <input class="input" type="date" id="m-date" />
        </div>
        <div class="field">
          <label>Available times</label>
          <div id="m-slots" class="slots"><span class="muted small">Pick a date to see open times.</span></div>
        </div>
        <div class="field">
          <label for="m-reason">Reason for visit (optional)</label>
          <textarea id="m-reason" placeholder="Briefly describe your symptoms or reason"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" onclick="closeModal()">Cancel</button>
        <button class="btn" id="m-confirm" disabled>Confirm booking</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = MAPS.requireAuth('patient');
    if (user) { MAPS.renderNav(); init(); }

    let allSpecialties = [];
    let selectedDoctor = null;
    let selectedSlot = null;
    let searchTimer = null;

    async function init() {
      // Load specialties for the filter.
      try {
        const { specialties } = await MAPS.api('/doctors/specialties');
        allSpecialties = specialties;
        const sel = document.getElementById('specialty');
        specialties.forEach(s => {
          const o = document.createElement('option');
          o.value = s.id; o.textContent = s.name;
          sel.appendChild(o);
        });
      } catch (_) {}

      document.getElementById('q').addEventListener('input', debounceSearch);
      document.getElementById('specialty').addEventListener('change', search);
      document.getElementById('m-date').addEventListener('change', loadSlots);
      document.getElementById('m-confirm').addEventListener('click', confirmBooking);
      // default min date = today
      document.getElementById('m-date').min = MAPS.todayStr();
      search();
    }

    function debounceSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(search, 250);
    }

    async function search() {
      const q = document.getElementById('q').value.trim();
      const specialty = document.getElementById('specialty').value;
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (specialty) params.set('specialty', specialty);
      const host = document.getElementById('results');
      host.innerHTML = `<div class="loading-wrap"><span class="spinner"></span></div>`;
      try {
        const { doctors } = await MAPS.api(`/doctors?${params.toString()}`);
        if (doctors.length === 0) {
          host.className = '';
          host.innerHTML = `<div class="empty card"><div class="big">🔍</div><p>No doctors match your search.</p></div>`;
          return;
        }
        host.className = 'grid cols-2';
        host.innerHTML = doctors.map(doctorCard).join('');
      } catch (err) {
        host.className = '';
        host.innerHTML = `<div class="alert error">${MAPS.escapeHtml(err.message)}</div>`;
      }
    }

    function doctorCard(d) {
      return `
        <div class="card doctor-card">
          <div class="doctor-head">
            <div class="avatar">${MAPS.initials(d.full_name)}</div>
            <div>
              <strong>${MAPS.escapeHtml(d.full_name)}</strong>
              <div class="muted small">${MAPS.escapeHtml(d.specialty_name || 'General')}${d.room ? ' · Room ' + MAPS.escapeHtml(d.room) : ''}</div>
            </div>
          </div>
          ${d.bio ? `<div class="bio">${MAPS.escapeHtml(d.bio)}</div>` : ''}
          <div><button class="btn sm" onclick='openModal(${JSON.stringify(d)})'>Book appointment</button></div>
        </div>`;
    }

    // ---- Booking modal ----
    function openModal(doctor) {
      selectedDoctor = doctor;
      selectedSlot = null;
      document.getElementById('m-alert').innerHTML = '';
      document.getElementById('m-doctor').textContent = doctor.full_name;
      document.getElementById('m-specialty').textContent = doctor.specialty_name || 'General';
      document.getElementById('m-avatar').textContent = MAPS.initials(doctor.full_name);
      document.getElementById('m-date').value = '';
      document.getElementById('m-reason').value = '';
      document.getElementById('m-slots').innerHTML = '<span class="muted small">Pick a date to see open times.</span>';
      document.getElementById('m-confirm').disabled = true;
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    async function loadSlots() {
      const date = document.getElementById('m-date').value;
      const host = document.getElementById('m-slots');
      selectedSlot = null;
      document.getElementById('m-confirm').disabled = true;
      if (!date) return;
      host.innerHTML = '<span class="spinner"></span>';
      try {
        const { slots } = await MAPS.api(`/doctors/${selectedDoctor.id}/availability?date=${date}`);
        if (slots.length === 0) {
          host.innerHTML = '<span class="muted small">No open times on this date. Try another day (doctors work weekdays).</span>';
          return;
        }
        host.innerHTML = slots
          .map(s => `<button type="button" class="slot" data-slot="${s}" onclick="pickSlot(this)">${MAPS.formatTime(s)}</button>`)
          .join('');
      } catch (err) {
        host.innerHTML = `<span class="alert error">${MAPS.escapeHtml(err.message)}</span>`;
      }
    }

    function pickSlot(el) {
      document.querySelectorAll('#m-slots .slot').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      selectedSlot = el.dataset.slot;
      document.getElementById('m-confirm').disabled = false;
    }

    async function confirmBooking() {
      if (!selectedDoctor || !selectedSlot) return;
      const btn = document.getElementById('m-confirm');
      btn.disabled = true; btn.textContent = 'Booking…';
      try {
        await MAPS.api('/appointments', {
          method: 'POST',
          body: {
            doctor_id: selectedDoctor.id,
            appt_date: document.getElementById('m-date').value,
            appt_time: selectedSlot,
            reason: document.getElementById('m-reason').value.trim() || null,
          },
        });
        closeModal();
        MAPS.toast('Appointment booked! Awaiting clinic confirmation.', 'success');
        setTimeout(() => (window.location.href = '/app/appointments.html'), 800);
      } catch (err) {
        document.getElementById('m-alert').innerHTML = `<div class="alert error">${MAPS.escapeHtml(err.message)}</div>`;
        // The slot may have been taken — refresh availability.
        loadSlots();
        btn.textContent = 'Confirm booking';
      }
    }
  </script>
</body>
</html>
