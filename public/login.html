<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — MAPS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <a class="brand" href="/"><span class="logo">M+</span> MAPS</a>
      </div>
      <div class="card">
        <h1 class="center">Welcome back</h1>
        <p class="center muted small">Log in to manage your appointments.</p>

        <div id="alert"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" autocomplete="current-password" required />
          </div>
          <button class="btn block" type="submit" id="submit">Log in</button>
        </form>

        <p class="center small" style="margin-top: 1.25rem;">
          New patient? <a href="/register.html">Create an account</a>
        </p>

        <div class="alert info small" style="margin-top: 1rem;">
          <strong>Demo logins</strong><br />
          Patient: <code>jdoe@example.com</code> / <code>patient123</code><br />
          Admin: <code>admin@maps.health</code> / <code>admin123</code>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Already logged in? Skip.
    const existing = MAPS.getUser();
    if (existing && MAPS.getToken()) window.location.href = MAPS.homeFor(existing);

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert');
    const btn = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const data = await MAPS.api('/auth/login', {
          method: 'POST',
          auth: false,
          body: {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        MAPS.setSession(data.token, data.user);
        window.location.href = MAPS.homeFor(data.user);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert error">${MAPS.escapeHtml(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
