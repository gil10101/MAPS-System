<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Doctors — MAPS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="page">
    <div class="container stack">
      <div class="row between">
        <div>
          <h1>Physicians</h1>
          <p class="muted" style="margin:0;">Add, edit, or deactivate providers.</p>
        </div>
        <button class="btn" onclick="openModal()">＋ Add physician</button>
      </div>

      <div class="card">
        <div id="list"><div class="loading-wrap"><span class="spinner"></span></div></div>
      </div>
    </div>
  </main>

  <!-- Add/Edit modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="m-title">Add physician</h3>
        <button class="close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="m-alert"></div>
        <input type="hidden" id="m-id" />
        <div class="field">
          <label for="m-name">Full name *</label>
          <input class="input" id="m-name" placeholder="Dr. Jane Smith" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="m-specialty">Specialty</label>
            <select id="m-specialty"><option value="">Unassigned</option></select>
          </div>
          <div class="field">
            <label for="m-room">Room</label>
            <input class="input" id="m-room" placeholder="A-101" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="m-email">Email</label>
            <input class="input" type="email" id="m-email" />
          </div>
          <div class="field">
            <label for="m-phone">Phone</label>
            <input class="input" id="m-phone" />
          </div>
        </div>
        <div class="field">
          <label for="m-bio">Bio</label>
          <textarea id="m-bio" placeholder="Short professional bio"></textarea>
        </div>
        <div class="field" id="active-field" style="display:none;">
          <label><input type="checkbox" id="m-active" /> Accepting appointments (active)</label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" onclick="closeModal()">Cancel</button>
        <button class="btn" id="m-save" onclick="save()">Save</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = MAPS.requireAuth('admin');
    let specialties = [];
    if (user) { MAPS.renderNav(); init(); }

    async function init() {
      try {
        const res = await MAPS.api('/admin/specialties');
        specialties = res.specialties;
        const sel = document.getElementById('m-specialty');
        specialties.forEach(s => {
          const o = document.createElement('option');
          o.value = s.id; o.textContent = s.name;
          sel.appendChild(o);
        });
      } catch (_) {}
      load();
    }

    async function load() {
      const host = document.getElementById('list');
      host.innerHTML = `<div class="loading-wrap"><span class="spinner"></span></div>`;
      try {
        const { doctors } = await MAPS.api('/admin/doctors');
        if (!doctors.length) {
          host.innerHTML = `<div class="empty"><div class="big">🩺</div><p>No physicians yet.</p></div>`;
          return;
        }
        host.innerHTML = `
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Specialty</th><th>Contact</th><th>Room</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${doctors.map(row).join('')}</tbody>
          </table></div>`;
      } catch (err) {
        host.innerHTML = `<div class="alert error">${MAPS.escapeHtml(err.message)}</div>`;
      }
    }

    function row(d) {
      return `
        <tr>
          <td><strong>${MAPS.escapeHtml(d.full_name)}</strong></td>
          <td class="muted">${MAPS.escapeHtml(d.specialty_name || '—')}</td>
          <td class="muted small">${MAPS.escapeHtml(d.email || '')}${d.phone ? '<br>' + MAPS.escapeHtml(d.phone) : ''}</td>
          <td>${MAPS.escapeHtml(d.room || '—')}</td>
          <td>${d.active ? '<span class="badge completed">Active</span>' : '<span class="badge cancelled">Inactive</span>'}</td>
          <td><div class="row" style="gap:.35rem;">
            <button class="btn secondary sm" onclick='openModal(${JSON.stringify(d)})'>Edit</button>
            ${d.active ? `<button class="btn danger sm" onclick="deactivate(${d.id})">Deactivate</button>` : ''}
          </div></td>
        </tr>`;
    }

    function openModal(doc) {
      document.getElementById('m-alert').innerHTML = '';
      const editing = !!doc;
      document.getElementById('m-title').textContent = editing ? 'Edit physician' : 'Add physician';
      document.getElementById('m-id').value = editing ? doc.id : '';
      document.getElementById('m-name').value = editing ? doc.full_name : '';
      document.getElementById('m-specialty').value = editing ? (doc.specialty_id || '') : '';
      document.getElementById('m-room').value = editing ? (doc.room || '') : '';
      document.getElementById('m-email').value = editing ? (doc.email || '') : '';
      document.getElementById('m-phone').value = editing ? (doc.phone || '') : '';
      document.getElementById('m-bio').value = editing ? (doc.bio || '') : '';
      document.getElementById('active-field').style.display = editing ? 'block' : 'none';
      document.getElementById('m-active').checked = editing ? !!doc.active : true;
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    async function save() {
      const id = document.getElementById('m-id').value;
      const name = document.getElementById('m-name').value.trim();
      if (!name) {
        document.getElementById('m-alert').innerHTML = `<div class="alert error">Name is required.</div>`;
        return;
      }
      const body = {
        full_name: name,
        specialty_id: document.getElementById('m-specialty').value || null,
        room: document.getElementById('m-room').value.trim() || null,
        email: document.getElementById('m-email').value.trim() || null,
        phone: document.getElementById('m-phone').value.trim() || null,
        bio: document.getElementById('m-bio').value.trim() || null,
      };
      const btn = document.getElementById('m-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        if (id) {
          body.active = document.getElementById('m-active').checked;
          await MAPS.api(`/admin/doctors/${id}`, { method: 'PUT', body });
        } else {
          await MAPS.api('/admin/doctors', { method: 'POST', body });
        }
        closeModal();
        MAPS.toast('Physician saved.', 'success');
        load();
      } catch (err) {
        document.getElementById('m-alert').innerHTML = `<div class="alert error">${MAPS.escapeHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Save';
      }
    }

    async function deactivate(id) {
      if (!confirm('Deactivate this physician? They will stop accepting new appointments.')) return;
      try {
        await MAPS.api(`/admin/doctors/${id}`, { method: 'DELETE' });
        MAPS.toast('Physician deactivated.', 'success');
        load();
      } catch (err) {
        MAPS.toast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
