<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Appointments — MAPS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="page">
    <div class="container stack">
      <div>
        <h1>Appointments</h1>
        <p class="muted" style="margin:0;">Approve, complete, or cancel patient bookings.</p>
      </div>

      <div class="card">
        <div class="field-row" style="margin-bottom:0;">
          <div class="field" style="margin-bottom:.5rem;">
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:.5rem;">
            <label for="f-doctor">Physician</label>
            <select id="f-doctor"><option value="">All physicians</option></select>
          </div>
          <div class="field" style="margin-bottom:.5rem;">
            <label for="f-date">Date</label>
            <input class="input" type="date" id="f-date" />
          </div>
        </div>
      </div>

      <div class="card">
        <div id="list"><div class="loading-wrap"><span class="spinner"></span></div></div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const user = MAPS.requireAuth('admin');
    if (user) { MAPS.renderNav(); init(); }

    async function init() {
      try {
        const { doctors } = await MAPS.api('/admin/doctors');
        const sel = document.getElementById('f-doctor');
        doctors.forEach(d => {
          const o = document.createElement('option');
          o.value = d.id; o.textContent = d.full_name;
          sel.appendChild(o);
        });
      } catch (_) {}
      ['f-status', 'f-doctor', 'f-date'].forEach(id =>
        document.getElementById(id).addEventListener('change', load));
      load();
    }

    async function load() {
      const params = new URLSearchParams();
      const status = document.getElementById('f-status').value;
      const doctor = document.getElementById('f-doctor').value;
      const date = document.getElementById('f-date').value;
      if (status) params.set('status', status);
      if (doctor) params.set('doctor_id', doctor);
      if (date) params.set('date', date);
      const host = document.getElementById('list');
      host.innerHTML = `<div class="loading-wrap"><span class="spinner"></span></div>`;
      try {
        const { appointments } = await MAPS.api(`/admin/appointments?${params.toString()}`);
        if (!appointments.length) {
          host.innerHTML = `<div class="empty"><div class="big">📅</div><p>No appointments match these filters.</p></div>`;
          return;
        }
        host.innerHTML = `
          <div class="table-wrap"><table>
            <thead><tr><th>Patient</th><th>Physician</th><th>Date</th><th>Time</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${appointments.map(row).join('')}</tbody>
          </table></div>`;
      } catch (err) {
        host.innerHTML = `<div class="alert error">${MAPS.escapeHtml(err.message)}</div>`;
      }
    }

    function row(a) {
      const actions = [];
      if (a.status === 'pending') actions.push(btn(a.id, 'confirmed', 'Confirm', 'btn'));
      if (a.status === 'pending' || a.status === 'confirmed') {
        actions.push(btn(a.id, 'completed', 'Complete', 'btn secondary'));
        actions.push(btn(a.id, 'cancelled', 'Cancel', 'btn danger'));
      }
      return `
        <tr>
          <td>
            <strong>${MAPS.escapeHtml(a.patient_name)}</strong>
            <div class="muted small">${MAPS.escapeHtml(a.patient_email)}</div>
          </td>
          <td>${MAPS.escapeHtml(a.doctor_name)}<div class="muted small">${MAPS.escapeHtml(a.specialty_name || '')}</div></td>
          <td>${MAPS.formatDate(a.appt_date)}</td>
          <td>${MAPS.formatTime(a.appt_time)}</td>
          <td class="muted">${MAPS.escapeHtml(a.reason || '—')}</td>
          <td>${MAPS.statusBadge(a.status)}</td>
          <td><div class="row" style="gap:.35rem;">${actions.join('') || '<span class="muted small">—</span>'}</div></td>
        </tr>`;
    }

    function btn(id, status, label, cls) {
      return `<button class="${cls} sm" onclick="setStatus(${id}, '${status}')">${label}</button>`;
    }

    async function setStatus(id, status) {
      if (status === 'cancelled' && !confirm('Cancel this appointment?')) return;
      try {
        await MAPS.api(`/admin/appointments/${id}/status`, { method: 'PATCH', body: { status } });
        MAPS.toast(`Appointment marked ${status}.`, 'success');
        load();
      } catch (err) {
        MAPS.toast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
