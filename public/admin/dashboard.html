<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Overview — MAPS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="page">
    <div class="container stack">
      <div>
        <h1>Clinic overview</h1>
        <p class="muted" style="margin:0;">Operational metrics across all patients and physicians.</p>
      </div>

      <div class="grid cols-4">
        <div class="card stat"><div class="value teal" id="s-total">–</div><div class="label">Total appointments</div></div>
        <div class="card stat"><div class="value" id="s-patients">–</div><div class="label">Registered patients</div></div>
        <div class="card stat"><div class="value" id="s-doctors">–</div><div class="label">Active physicians</div></div>
        <div class="card stat"><div class="value" id="s-cancel">–</div><div class="label">Cancellation rate</div></div>
      </div>

      <div class="grid cols-2">
        <div class="card">
          <h3>Appointments by status</h3>
          <div id="status-bars"><div class="loading-wrap"><span class="spinner"></span></div></div>
        </div>
        <div class="card">
          <h3>Volume by specialty</h3>
          <div id="specialty-bars"><div class="loading-wrap"><span class="spinner"></span></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><h3>Physician utilization</h3></div>
        <div id="util"><div class="loading-wrap"><span class="spinner"></span></div></div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const user = MAPS.requireAuth('admin');
    if (user) { MAPS.renderNav(); load(); }

    async function load() {
      try {
        const [{ summary }, { utilization }, { volume }] = await Promise.all([
          MAPS.api('/admin/reports/summary'),
          MAPS.api('/admin/reports/physician-utilization'),
          MAPS.api('/admin/reports/volume-by-specialty'),
        ]);
        renderSummary(summary);
        renderStatusBars(summary.appointments);
        renderSpecialty(volume);
        renderUtil(utilization);
      } catch (err) {
        MAPS.toast(err.message, 'error');
      }
    }

    function renderSummary(s) {
      document.getElementById('s-total').textContent = s.appointments.total;
      document.getElementById('s-patients').textContent = s.total_patients;
      document.getElementById('s-doctors').textContent = s.active_doctors;
      document.getElementById('s-cancel').textContent = s.cancellation_rate + '%';
    }

    function bar(label, value, max, color) {
      const pct = max ? Math.round((value / max) * 100) : 0;
      return `
        <div style="margin-bottom:.7rem;">
          <div class="row between" style="margin-bottom:.2rem;">
            <span class="small">${MAPS.escapeHtml(label)}</span>
            <strong class="small">${value}</strong>
          </div>
          <div style="background:var(--line); border-radius:999px; height:9px; overflow:hidden;">
            <div style="width:${pct}%; height:100%; background:${color}; border-radius:999px;"></div>
          </div>
        </div>`;
    }

    function renderStatusBars(a) {
      const items = [
        ['Pending', a.pending, 'var(--amber)'],
        ['Confirmed', a.confirmed, 'var(--blue-600)'],
        ['Completed', a.completed, 'var(--green)'],
        ['Cancelled', a.cancelled, 'var(--red)'],
      ];
      const max = Math.max(1, ...items.map(i => i[1]));
      document.getElementById('status-bars').innerHTML = items.map(i => bar(i[0], i[1], max, i[2])).join('');
    }

    function renderSpecialty(volume) {
      const host = document.getElementById('specialty-bars');
      if (!volume.length) { host.innerHTML = '<p class="muted small">No data yet.</p>'; return; }
      const max = Math.max(1, ...volume.map(v => v.total_appointments));
      host.innerHTML = volume.map(v => bar(v.specialty_name, v.total_appointments, max, 'var(--teal-500)')).join('');
    }

    function renderUtil(rows) {
      const host = document.getElementById('util');
      if (!rows.length) { host.innerHTML = '<p class="muted small">No physicians yet.</p>'; return; }
      host.innerHTML = `
        <div class="table-wrap"><table>
          <thead><tr><th>Physician</th><th>Specialty</th><th>Total</th><th>Upcoming</th><th>Completed</th><th>Cancelled</th></tr></thead>
          <tbody>${rows.map(r => `
            <tr>
              <td><strong>${MAPS.escapeHtml(r.full_name)}</strong></td>
              <td class="muted">${MAPS.escapeHtml(r.specialty_name || '—')}</td>
              <td>${r.total_appointments}</td>
              <td>${r.upcoming || 0}</td>
              <td>${r.completed || 0}</td>
              <td>${r.cancelled || 0}</td>
            </tr>`).join('')}</tbody>
        </table></div>`;
    }
  </script>
</body>
</html>
