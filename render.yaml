# Render.com deployment config (free tier).
# 1. Push this repo to GitHub and create a free Postgres DB at https://neon.tech.
# 2. On render.com: New + > Blueprint, point it at this repo.
# 3. When prompted, paste your Neon connection string as DATABASE_URL.
#
# The build compiles the React client; the start command seeds demo data
# (skipped when data already exists — the database lives on Neon, so it
# persists across deploys/restarts) and starts the Express server, which
# serves both the API and the built frontend.
services:
  - type: web
    name: maps-system
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # set this in the Render dashboard (Neon connection string)
