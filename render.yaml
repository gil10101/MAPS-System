# Render.com deployment config (free tier).
# 1. Push this repo to GitHub.
# 2. On render.com: New + > Blueprint, point it at this repo.
# 3. Render reads this file, installs, seeds demo data, and starts the server.
#
# Note: the free tier's disk is ephemeral, so the SQLite database resets on
# each deploy/restart. The start command re-seeds demo data automatically so
# the app is always populated for a demo. JWT_SECRET is generated by Render.
services:
  - type: web
    name: maps-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
